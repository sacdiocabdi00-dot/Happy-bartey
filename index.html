<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy-bartey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Amiri:wght@400;700&family=Dancing+Script:wght@600;700&family=Pacifico&family=Reenie+Beanie&family=Cairo:wght@400;700&family=Readex+Pro:wght@400;600&family=Cinzel:wght@600&family=Permanent+Marker&family=Sacramento&family=Bubblegum+Sans&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow-x: hidden;
    }

    @keyframes fadeInScale {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes floatEffect {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 20, 147, 0.4); }
      50% { box-shadow: 0 0 30px rgba(255, 20, 147, 0.8); }
    }

    @keyframes bounceAnim {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.03); }
    }

    .anim-fade { animation: fadeInScale 0.8s ease forwards; }
    .anim-bounce { animation: bounceAnim 1.5s infinite ease-in-out; }
    .anim-float { animation: floatEffect 2s infinite ease-in-out; }

    .page {
      display: none;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .page.active {
      display: flex;
      animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .btn-back {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }
    .btn-back:hover { background: rgba(255, 20, 147, 0.8); }

    .btn-music-toggle {
      position: fixed;
      top: 60px;
      right: 15px;
      z-index: 150;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 1px solid #ff1493;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
    }

    .created-by-badge {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border: 1px solid #ff1493;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5);
    }

    /* Page Loading Style */
    #page-loading {
      background-image: radial-gradient(circle, #7a0016 0%, #2a0008 100%);
      flex-direction: column;
      gap: 15px;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .loader-title { font-family: 'Great Vibes', cursive; font-size: 44px; color: #ff80bf; }
    .countdown-number { font-size: 90px; font-weight: 900; color: #ffffff; line-height: 1; margin: 10px 0; }
    .progress-container { width: 80%; max-width: 280px; height: 9px; background: rgba(255, 255, 255, 0.15); border-radius: 20px; overflow: hidden; }
    .progress-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff1493, #ff69b4, #ffeb3b); border-radius: 20px; transition: width 1s linear; }

    /* Page 1 & Components */
    #page-1 { background-image: radial-gradient(circle, #a80000 0%, #500000 100%); padding: 20px; }
    .envelope-card { background-color: #fdfbf7; width: 100%; max-width: 360px; border-radius: 18px; padding: 40px 20px 30px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .greeting-title { font-family: 'Great Vibes', cursive; font-size: 44px; color: #9e1b1b; margin-bottom: 25px; }
    .red-envelope { width: 85%; height: 110px; background-color: #9e1b1b; border-radius: 8px; position: relative; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }

    /* Letter Page */
    #page-letter { background-color: #000; overflow-y: auto; padding: 50px 10px 30px; display: none; justify-content: center; align-items: flex-start; }
    #page-letter.active { display: flex; }

    .letter-wrapper-new { 
      position: relative; 
      width: 100%; 
      max-width: 400px; 
      background-image: url('https://i.postimg.cc/R0MrNdpD/64d90aa58e80dae7fd6171a945c4c640.jpg'); 
      background-size: cover; 
      background-position: center; 
      border-radius: 12px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
      aspect-ratio: 9 / 16; 
      overflow: hidden; 
      margin: 0 auto; 
    }

    .custom-letter-text-new {
      position: absolute;
      top: 26%;
      left: 14%;
      width: 72%;
      height: 55%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Amiri', serif;
      font-size: 18px;
      color: #222222;
      line-height: 1.5;
      padding: 5px;
    }

    .letter-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
      z-index: 50;
      align-items: center;
    }

    .btn-edit-text-toggle {
      background: #ff1493;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(255, 20, 147, 0.4);
    }
  </style>
</head>
<body>

  <!-- Background Music Persistent Container -->
  <div id="audioPlayerContainer">
    <audio id="persistentAudio" autoplay loop>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>
  </div>

  <button id="musicToggleBtn" class="btn-music-toggle" onclick="togglePlayMusic()">
    <span id="musicIcon">🔊</span> <span id="musicText">Music On</span>
  </button>

  <a href="#" class="created-by-badge">🔥 Created with Love</a>

  <!-- Loading Page -->
  <div id="page-loading" class="page active">
    <h1 class="loader-title">Welcome ❤️</h1>
    <div id="countdownNum" class="countdown-number">3</div>
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <p style="font-size: 14px; font-weight: 700; color: #ffb3d9;">LOADING YOUR SURPRISE...</p>
  </div>

  <!-- Page 1 -->
  <div id="page-1" class="page">
    <div class="envelope-card">
      <h1 class="greeting-title">Happy Birthday!</h1>
      <div class="red-envelope" onclick="openPageWithCountdown('page-letter', 1)">
        <div style="width: 38px; height: 30px; background: #fff; border-radius: 50%;"></div>
      </div>
      <p style="font-size: 12px; color: #77; margin-top: 15px;">Click to open letter</p>
    </div>
  </div>

  <!-- Page Letter (Halka Edit iyo Fariintu ku jiraan) -->
  <div id="page-letter" class="page">
    <button class="btn-back" onclick="openPageWithCountdown('page-1', 1)">← Back</button>

    <div class="letter-wrapper-new" id="letterWrapperBox">
      <!-- Badhanka Edit-ka oo si cad halkaan uga muuqda -->
      <div class="letter-controls">
        <button class="btn-edit-text-toggle" onclick="toggleTextEdit()">✏️ Edit</button>
      </div>

      <textarea id="customLetterNote" class="custom-letter-text-new" placeholder="Halkan ku qor farriintaada..." readonly>Halkan ku qor farriintaada quruxda badan... ❤️</textarea>
    </div>
  </div>

  <script>
    let isMusicPlaying = true;
    const audioEl = document.getElementById('persistentAudio');

    // Maamulka Muusigga oo aan naga go'ayn marka bogagga la beddelayo
    function togglePlayMusic() {
      const musicIcon = document.getElementById('musicIcon');
      const musicText = document.getElementById('musicText');

      if (isMusicPlaying) {
        audioEl.pause();
        isMusicPlaying = false;
        musicIcon.innerText = "🔇";
        musicText.innerText = "Music Off";
      } else {
        audioEl.play().catch(e => console.log("Audio play error:", e));
        isMusicPlaying = true;
        musicIcon.innerText = "🔊";
        musicText.innerText = "Music On";
      }
    }

    // Awoodsiinta Edit-ka Qoraalka
    function toggleTextEdit() {
      const textarea = document.getElementById('customLetterNote');
      if (textarea.hasAttribute('readonly')) {
        textarea.removeAttribute('readonly');
        textarea.focus();
      } else {
        textarea.setAttribute('readonly', true);
      }
    }

    // Hannaanka Countdown-ka iyo Beddelidda Bogagga
    let timerInterval = null;
    function openPageWithCountdown(targetPageId, durationSeconds) {
      clearInterval(timerInterval);
      
      let timeLeft = durationSeconds;
      const countdownNum = document.getElementById('countdownNum');
      const progressBar = document.getElementById('progressBar');
      
      countdownNum.innerText = timeLeft;
      progressBar.style.width = '100%';

      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById('page-loading').classList.add('active');

      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) {
          countdownNum.innerText = timeLeft;
          progressBar.style.width = (timeLeft / durationSeconds) * 100 + '%';
        }
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('page-loading').classList.remove('active');
          document.getElementById(targetPageId).classList.add('active');
          
          // Hubinta in muusiggu sii wado shaqadiisa haddii uu daaran yahay
          if (isMusicPlaying) {
            audioEl.play().catch(e => console.log("Autoplay error:", e));
          }
        }
      }, 1000);
    }

    // Si uu muusiggu u bilaabmo marka ugu horreysa ee isticmaaluhu tabto shaashadda
    document.body.addEventListener('click', () => {
      if (isMusicPlaying && audioEl.paused) {
        audioEl.play().catch(e => console.log(e));
      }
    }, { once: true });
  </script>

</body>
</html>
